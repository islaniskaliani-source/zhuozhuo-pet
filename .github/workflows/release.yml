name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mac
          - os: windows-latest
            artifact: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build and publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --${{ matrix.artifact }} --publish always

      - name: Dump electron-builder log on failure
        if: failure()
        shell: bash
        run: |
          LOG=$(ls -t "$HOME/AppData/Local/electron-builder/Log"/*.log "$HOME/Library/Logs/electron-builder"/*.log 2>/dev/null | head -1)
          if [ -z "$LOG" ]; then LOG=$(ls -t /tmp/electron-builder*.log 2>/dev/null | head -1); fi
          if [ -n "$LOG" ]; then
            python3 -c "import sys,pathlib; t=pathlib.Path(sys.argv[1]).read_text(errors='replace')[-3000:]; print('::error::'+t.replace(chr(13),'').replace(chr(10),'%0A'))" "$LOG"
          else
            echo "::error::no electron-builder log found"
          fi
